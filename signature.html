<script>
(function(){
  var PH='https://raw.githubusercontent.com/Ademord/gmail-signature/main/sig', stage=document.getElementById('stage'), base=document.getElementById('base'), msg=document.getElementById('msg');
  var tpl=stage.innerHTML;
  function html(){ return tpl.split(PH).join(base.value.replace(/\/+$/,'')); }
  base.addEventListener('input',function(){ stage.innerHTML=html(); });
  document.getElementById('copy').addEventListener('click',function(){
    var h=html().replace(/<!--[\s\S]*?-->/g,'').trim();
    var done=function(){ msg.textContent='Copied ('+h.length+' chars). Paste into Gmail > Settings > Signature.'; };
    if(navigator.clipboard&&window.ClipboardItem){
      navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([h],{type:'text/html'}),'text/plain':new Blob([h],{type:'text/plain'})})]).then(done,function(){ fallback(); });
    } else fallback();
    function fallback(){ var r=document.createRange(); r.selectNodeContents(stage); var s=getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand('copy'); s.removeAllRanges(); done(); }
  });
})();
</script>
